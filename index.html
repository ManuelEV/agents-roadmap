<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Agents Roadmap: aprende a construir agentes de IA con laboratorios interactivos, una guía de referencia con diagramas paso a paso y el recorrido completo en Google Cloud, AWS, Microsoft Azure y Vercel. En español." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f3f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1013" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400..700&family=Google+Sans+Flex:opsz,wght,ROND@6..144,300..800,0..100&display=swap" rel="stylesheet" />
    <title>Agents Roadmap · De cómo piensa un LLM a un agente en producción</title>
    <script>
      try {
        const t = localStorage.getItem('theme')
        const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch { document.documentElement.dataset.theme = 'dark' }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
